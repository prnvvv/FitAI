<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FitAI system architecture">
  <title>FitAI system architecture — modular monolith</title>
  <defs>
    <marker id="archArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e2a24f" fill-opacity="0.55"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#0a0806"/>

  <text x="600" y="38" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="4" fill="#e2a24f" fill-opacity="0.85">SYSTEM ARCHITECTURE</text>
  <text x="600" y="58" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" fill="#efe6d8">Modular monolith — one deployable, clearly owned layers</text>

  <!-- FRONTEND band -->
  <rect x="60" y="80" width="1080" height="78" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#efe6d8">FRONTEND</text>
  <text x="600" y="136" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b3aa9d">React 19 &#183; TypeScript &#183; Vite — chat, profile, progress, memory &amp; document controls</text>

  <line x1="600" y1="158" x2="600" y2="194" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>

  <!-- API LAYER / AGENT LAYER -->
  <rect x="60" y="196" width="520" height="88" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="320" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#efe6d8">API LAYER</text>
  <text x="320" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">FastAPI routers &#183; request validation</text>
  <text x="320" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">auth &#183; chat &#183; memory &#183; documents &#183; workouts…</text>

  <rect x="620" y="196" width="520" height="88" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="880" y="230" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#efe6d8">AGENT LAYER</text>
  <text x="880" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">LangGraph state, nodes &amp;</text>
  <text x="880" y="270" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">conditional routing</text>

  <path d="M320,284 C320,320 600,320 600,338" fill="none" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>
  <path d="M880,284 C880,320 600,320 600,338" fill="none" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>

  <!-- SERVICE LAYER -->
  <rect x="60" y="340" width="1080" height="80" rx="4" fill="#151310" stroke="#44392b" stroke-width="1.25"/>
  <text x="600" y="374" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#e9a447">SERVICE LAYER</text>
  <text x="600" y="398" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#b3aa9d">business logic — the agreed interface between persistence and the AI engine</text>

  <path d="M600,420 C600,448 230,448 230,462" fill="none" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>
  <path d="M600,420 L600,462" fill="none" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>
  <path d="M600,420 C600,448 970,448 970,462" fill="none" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>

  <!-- Repositories/Models -->
  <rect x="60" y="464" width="340" height="96" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="230" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">REPOSITORIES &amp; MODELS</text>
  <text x="230" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">SQLAlchemy 2 entities &amp;</text>
  <text x="230" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">persistence queries</text>

  <!-- Memory/RAG/Tools -->
  <rect x="430" y="464" width="340" height="96" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="600" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">MEMORY &#183; RAG &#183; TOOLS</text>
  <text x="600" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">fact extraction, retrieval &amp;</text>
  <text x="600" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">deterministic fitness calculators</text>

  <!-- Safety/LLM -->
  <rect x="800" y="464" width="340" height="96" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="970" y="496" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">SAFETY &amp; LLM</text>
  <text x="970" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">guardrail policy checks &amp;</text>
  <text x="970" y="536" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">the Groq client</text>

  <line x1="230" y1="560" x2="230" y2="596" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>
  <line x1="600" y1="560" x2="600" y2="596" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>
  <line x1="970" y1="560" x2="970" y2="596" stroke="#e2a24f" stroke-opacity="0.5" marker-end="url(#archArrow)"/>

  <!-- DATA row -->
  <rect x="60" y="598" width="340" height="86" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="230" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">POSTGRESQL</text>
  <text x="230" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">authoritative store, via Supabase</text>

  <rect x="430" y="598" width="340" height="86" rx="4" fill="#0e0c0a" stroke="#2a2824"/>
  <text x="600" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">CHROMADB</text>
  <text x="600" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">document chunks &amp; embeddings</text>

  <rect x="800" y="598" width="340" height="86" rx="4" fill="#0e0c0a" stroke="#44392b" stroke-dasharray="4 3"/>
  <text x="970" y="634" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#efe6d8">GROQ API</text>
  <text x="970" y="656" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#b3aa9d">external LLM inference</text>

  <line x1="100" y1="722" x2="1100" y2="722" stroke="#e2a24f" stroke-opacity="0.18"/>
  <text x="600" y="750" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" letter-spacing="1" fill="#77736d">Router &#8594; Schema &#8594; Service &#8594; Repository &#8594; Model</text>
</svg>
