<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FitAI — Train with Intelligence">
  <title>FitAI — Train with Intelligence</title>
  <defs>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9a066"/>
      <stop offset="100%" stop-color="#b9773f"/>
    </linearGradient>
    <linearGradient id="arcFade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2a24f" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e2a24f" stop-opacity="0.08"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#e2a24f" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#e2a24f" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="#0a0806"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- raking light bands, echoing the column photography on the live site -->
  <g opacity="0.05">
    <polygon points="760,0 980,0 640,400 420,400" fill="#e2a24f"/>
    <polygon points="1020,0 1120,0 900,400 800,400" fill="#e2a24f"/>
  </g>

  <!-- gold arc motif, cropped by the canvas like the live backdrop -->
  <circle cx="1040" cy="430" r="300" fill="none" stroke="url(#arcFade)" stroke-width="1.4"/>
  <circle cx="1040" cy="430" r="300" fill="none" stroke="#e2a24f" stroke-opacity="0.12" stroke-width="1"/>

  <!-- 5-bar pulse mark -->
  <g transform="translate(90,58)" fill="#e2a24f">
    <rect x="0"  y="14" width="6" height="18" rx="3"/>
    <rect x="12" y="6"  width="6" height="34" rx="3"/>
    <rect x="24" y="0"  width="6" height="46" rx="3"/>
    <rect x="36" y="8"  width="6" height="30" rx="3"/>
    <rect x="48" y="16" width="6" height="14" rx="3"/>
  </g>
  <text x="166" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="600" fill="#efe6d8">FitAI</text>

  <!-- eyebrow -->
  <text x="90" y="156" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="4.5" fill="#e2a24f" fill-opacity="0.85">DISCIPLINE &#215; INTELLIGENCE &#215; PROGRESS</text>

  <!-- headline -->
  <text x="88" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#efe6d8">Train with</text>
  <text x="88" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="url(#goldText)">Intelligence.</text>

  <!-- subtext -->
  <text x="90" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b3aa9d">Agentic RAG for gym-goers — grounded answers, persistent</text>
  <text x="90" y="352" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#b3aa9d">memory, and real fitness math.</text>

  <!-- hairline divider -->
  <line x1="90" y1="380" x2="1110" y2="380" stroke="#e2a24f" stroke-opacity="0.18"/>
</svg>
