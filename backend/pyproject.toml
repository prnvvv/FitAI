[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "fitai-backend"
version = "0.0.1"
description = "Backend for FitAI, an agentic RAG chatbot for fitness and nutrition."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "FitAI Team" },
]
keywords = ["fastapi", "rag", "fitness", "langgraph", "supabase"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.115.0,<0.163",
    "uvicorn[standard]>=0.32.0,<0.55",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.6.0,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14.0,<1.15",
    "psycopg2-binary>=2.9.10,<3",
    "supabase>=2.10.0,<3",
    "pyjwt>=2.9.0,<3",
    "python-multipart>=0.0.17,<0.1",
    "langgraph>=0.2.45,<0.3",
    "langchain-core>=0.3.0,<0.4",
    "groq>=0.11.0,<0.12",
    "chromadb>=0.5.20,<0.7",
    # Pin posthog so chromadb's telemetry call (positional capture API) keeps working.
    "posthog>=2.4,<3.0",
    "pypdf>=6.21.4,<7",
    "python-docx>=1.1.2,<2",
    # Image text extraction: Pillow for prep, RapidOCR (ONNX) for local OCR.
    "pillow>=10.4.0,<13",
    "rapidocr-onnxruntime>=1.4.4,<2",
    "httpx>=0.27.0,<0.28",
    "python-dotenv>=1.0.1,<2",
    "structlog>=24.4.0,<25",
    "ddgs>=9.0.0",
    # Pinned below 2 for the ONNX/OpenCV stack used by Chroma and RapidOCR.
    "numpy>=1.26.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9",
    "pytest-asyncio>=0.24.0,<0.25",
    "pytest-cov>=6.0.0,<8",
    "ruff>=0.7.0,<0.8",
    "mypy>=1.13.0,<2.5",
    "pre-commit>=4.0.0,<4.1",
    "coverage>=7.6.0,<8",
]

[project.urls]
Repository = "https://github.com/prnvvv/FitAI"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "ASYNC", # flake8-async
]
ignore = [
    "E501", # line-too-long is handled by the formatter
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Cookie",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
exclude = [
    "migrations",
    ".venv",
    "venv",
]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Binary-heavy third-party libraries ship stubs that may use newer syntax
# than the project's mypy target. Ignore errors in them instead of failing
# the whole run.
module = [
    "numpy",
    "numpy.*",
    "onnxruntime.*",
    "tokenizers.*",
    "chromadb",
    "chromadb.*",
]
ignore_errors = true
follow_imports = "skip"

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = [
    "tests/*",
    "migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0
