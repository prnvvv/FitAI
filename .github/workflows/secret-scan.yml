# Secret scanning configuration.
#
# The backend job in this repository intentionally runs with an empty
# `GROQ_API_KEY`, `GROQ_EXTRACTION_API_KEY`, and `PROMPT_GUARD_API_KEY`. Any
# non-empty value appearing in a pull request from a fork therefore indicates a
# leaked credential and fails the run.
name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leaked-credentials:
    name: Detect committed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_EXTRACTION_API_KEY: ${{ secrets.GROQ_EXTRACTION_API_KEY }}
      PROMPT_GUARD_API_KEY: ${{ secrets.PROMPT_GUARD_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify committed text contains no credential values
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          names = [
              "GROQ_API_KEY",
              "GROQ_EXTRACTION_API_KEY",
              "PROMPT_GUARD_API_KEY",
          ]
          # Only real values count; an unset or blank repository secret is not
          # a credential and must not fail the job.
          values = [(n, (os.environ.get(n) or "").strip()) for n in names]
          values = [(n, v) for n, v in values if len(v) >= 20]
          if not values:
              print("No credential values configured; nothing to scan for.")
              sys.exit(0)

          changed = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              capture_output=True,
              text=True,
              check=True,
          ).stdout.split()

          leaked = []
          for path in changed:
              try:
                  with open(path, encoding="utf-8", errors="ignore") as handle:
                      content = handle.read()
              except OSError:
                  continue
              for name, value in values:
                  if value in content:
                      leaked.append((path, name))

          if leaked:
              for path, name in leaked:
                  print(f"ERROR: the {name} value appears in {path}")
              print("Revoke and rotate the exposed credential, then purge it from history.")
              sys.exit(1)

          print("No credential values found in changed files.")
          PY