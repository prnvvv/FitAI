name: Backend CI

# Continuous integration for the FastAPI backend: lint, formatting, and the
# pytest suite. Runs on every pull request that can land on `main` and on every
# push to `main`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The backend job only ever needs to read the repository.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      # ChromaDB telemetry must be disabled before the package is imported.
      ANONYMIZED_TELEMETRY: "False"
      # No secrets are provided to this job. The suite mocks the Groq client
      # and runs against an isolated in-memory SQLite database, so real
      # credentials, Supabase, or PostgreSQL are never required.
      GROQ_API_KEY: ""
      GROQ_EXTRACTION_API_KEY: ""
      PROMPT_GUARD_API_KEY: ""
      # Several document API tests exercise the local storage backend and only
      # override the upload directory, so the backend has to be configured.
      # Uploads stay inside the runner workspace; nothing leaves the job.
      DOCUMENT_STORAGE_BACKEND: local
      UPLOAD_DIR: ./uploads
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # Matches the floor declared in backend/pyproject.toml.
          python-version: "3.10"

      - name: Install backend and dev dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check app tests

      - name: Ruff formatting
        run: uv run ruff format --check app tests

      - name: Pytest
        run: uv run pytest